plugins {
    id "java-library"
    id "eclipse"
    id "idea"
    id "maven-publish"
    id "net.neoforged.gradle.userdev" version "7.0.183"
}

// NeoGradle handles mixins itself; the SpongePowered mixingradle plugin and the
// generated refmap are both gone. With official mappings the mixin targets already
// carry their runtime names, so no refmap is needed or produced.

version = "${project.minecraft}-${project.modVersion}"
group = "net.thevaliantsquidward"
base {
    archivesName = "Vintage-Vibes"
}

// NeoForge 1.21.1 requires Java 21. This is a forced change from upstream's Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    accessTransformers.file("src/main/resources/META-INF/accesstransformer.cfg")
}

runs {
    configureEach {
        systemProperty "forge.logging.markers", "REGISTRIES"
        systemProperty "forge.logging.console.level", "debug"
        modSource project.sourceSets.main
    }

    client {
        workingDirectory.set(project.file("run"))
    }

    server {
        workingDirectory.set(project.file("run"))
        programArgument "--nogui"
    }

    data {
        workingDirectory.set(project.file("run"))
        programArguments.addAll "--mod", project.modId, "--all",
                "--output", file("src/generated/resources/").getAbsolutePath(),
                "--existing", file("src/main/resources/").getAbsolutePath()
    }
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neoforge}"

    // JEI was a dev-time dependency only - nothing under src/ ever referenced it,
    // so it is dropped for the duration of the port rather than bumped to JEI 19.
    // The dev-only CurseForge mods (cyanide, commandstructures, structure-void-toggle,
    // worldedit) are dropped for the same reason; none are needed to build or run.
}

tasks.named("processResources", ProcessResources).configure {
    var replaceProperties = [
            minecraft      : minecraft,
            minecraft_range: minecraft_range,
            neoforge       : neoforge,
            neoforge_range : neoforge_range,
            loader_range   : loader_range,
            modId          : modId,
            modName        : modName,
            modVersion     : modVersion
    ]
    inputs.properties replaceProperties
    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : project.modName,
                "Specification-Vendor"    : "ValiantEnvoy",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.modName,
                "Implementation-Version"  : project.modVersion,
                "Implementation-Vendor"   : "ValiantEnvoy",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
